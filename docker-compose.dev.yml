version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: projectbold-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectbold
      POSTGRES_PASSWORD: projectbold
      POSTGRES_DB: projectbold_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/backend/src/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectbold -d projectbold_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Sessions/Cache
  redis:
    image: redis:7-alpine
    container_name: projectbold-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Development)
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.dev
    container_name: projectbold-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://projectbold:projectbold@postgres:5432/projectbold_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-not-for-production
      SAML_MOCK_MODE: "true"
    ports:
      - "4000:4000"
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/shared:/app/packages/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend (Development)
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile.dev
    container_name: projectbold-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/public:/app/packages/frontend/public
      - ./packages/shared:/app/packages/shared
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: projectbold-network
